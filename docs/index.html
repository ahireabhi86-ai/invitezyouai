<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>invitezyouai — Offline demo</title><style>:root {
  --ink: #111827;
  --ivory: #f8f7f4;
  --gold: #b89a70;
  --sage: #dce7e4;
  --line: #e7e1d8;
  --muted: #575c65;
  --paper: #fffdf9;
}
* {
  box-sizing: border-box;
}
html {
  scroll-behavior: smooth;
}
body {
  margin: 0;
  background: var(--ivory);
  color: var(--ink);
  font-family: "Inter Variable", system-ui, "Noto Sans Devanagari", sans-serif;
  line-height: 1.6;
}
a {
  color: inherit;
  text-decoration: none;
}
button,
input,
select,
textarea {
  font: inherit;
}
button {
  cursor: pointer;
}
button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
h1,
h2,
h3,
p {
  margin: 0;
}
h1,
h2,
h3,
.brand {
  font-family: "Manrope Variable", system-ui, sans-serif;
  line-height: 1.12;
  letter-spacing: -0.045em;
}
h1 {
  font-size: clamp(2.65rem, 6vw, 5.6rem);
  font-weight: 700;
}
h2 {
  font-size: clamp(1.65rem, 3.3vw, 2.9rem);
}
h3 {
  font-size: 1.24rem;
}
p {
  color: var(--muted);
}
small,
.muted {
  color: var(--muted);
}
:focus-visible {
  outline: 2px solid #82613c;
  outline-offset: 4px;
}
.shell {
  width: min(1190px, calc(100% - 80px));
  margin-inline: auto;
}
.top {
  border-bottom: 1px solid var(--line);
}
.nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 79px;
  gap: 16px;
}
.nav nav,
.studio,
.brand,
.row,
.actions,
.inline,
.textlink,
.button,
.outline {
  display: flex;
  align-items: center;
  gap: 10px;
}
.nav nav {
  gap: 34px;
  font-size: 0.9rem;
}
.nav a:hover,
.textlink:hover {
  color: #78572f;
}
.brand {
  font-size: 1.35rem;
  font-weight: 800;
  gap: 8px;
  white-space: nowrap;
}
.brand span:first-child:not(.dot) {
  display: grid;
  place-items: center;
  width: 33px;
  height: 33px;
  border-radius: 50%;
  background: var(--ink);
  color: #f5e5ca;
}
.dot {
  color: #96744c;
  margin-left: -6px;
}
.studio,
.outline {
  border: 1px solid #dcd4c8;
  border-radius: 8px;
  padding: 8px 13px;
  background: transparent;
  color: var(--ink);
  font-size: 0.86rem;
  font-weight: 650;
}
.hero {
  display: grid;
  grid-template-columns: 1fr 1.05fr;
  align-items: center;
  gap: 58px;
  padding-block: 59px;
}
.hero h1 {
  margin: 17px 0 21px;
}
.hero h1 em {
  font:
    italic 1.07em/0.99 Georgia,
    serif;
  letter-spacing: -0.075em;
  color: #90704b;
}
.hero p {
  max-width: 410px;
  font-size: 1.08rem;
}
.eyebrow {
  display: flex;
  align-items: center;
  gap: 9px;
  color: #75593a;
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.2em;
}
.eyebrow span {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--gold);
}
.actions {
  flex-wrap: wrap;
  gap: 16px;
  margin-top: 26px;
}
.button {
  align-self: start;
  justify-content: center;
  width: fit-content;
  border: 1px solid var(--ink);
  border-radius: 8px;
  padding: 11px 17px;
  background: var(--ink);
  color: white;
  font-size: 0.9rem;
  font-weight: 650;
}
.button:hover {
  background: #333b4a;
  color: white;
}
.textlink {
  font-size: 0.9rem;
  font-weight: 700;
  width: fit-content;
}
.hero-art {
  position: relative;
  min-height: 430px;
  border-radius: 14px;
  overflow: hidden;
  background: #e7d6bb;
}
.hero-art img {
  object-fit: cover;
}
.art-caption {
  position: absolute;
  bottom: 16px;
  left: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  background: #fffcf2ed;
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 0.64rem;
  letter-spacing: 0.16em;
  font-weight: 800;
}
.strip {
  background: var(--sage);
  border-block: 1px solid #d3dfdb;
}
.strip-inner {
  display: flex;
  justify-content: space-evenly;
  gap: 12px;
  flex-wrap: wrap;
  padding-block: 15px;
}
.strip span {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.85rem;
  font-weight: 620;
}
.strip svg {
  width: 17px;
}
.how,
.page {
  padding-block: 65px;
}
.how h2,
.page h1 {
  margin: 12px 0;
}
.page h1 {
  font-size: clamp(2.25rem, 5vw, 4.2rem);
}
.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
  margin-top: 25px;
}
.card,
.empty,
.engine {
  border: 1px solid var(--line);
  background: var(--paper);
  border-radius: 13px;
  padding: 23px;
  min-width: 0;
  overflow-wrap: anywhere;
}
.card h3 {
  margin: 8px 0;
}
.feature-icon {
  background: var(--sage);
  width: 43px;
  height: 43px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  margin-bottom: 12px;
}
.empty {
  text-align: center;
  padding: 55px 20px;
  margin-top: 22px;
}
.empty .feature-icon {
  margin: 0 auto 15px;
}
.empty p {
  margin-top: 8px;
}
.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 22px 0;
}
.filters a {
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 6px 13px;
  font-size: 0.84rem;
  text-transform: capitalize;
}
.filters .active {
  color: #fff;
  background: var(--ink);
  border-color: var(--ink);
}
.row {
  justify-content: space-between;
}
.catalog .row {
  margin-top: 15px;
}
.thumb {
  aspect-ratio: 16/10;
  background-position: center;
  background-size: cover;
  border-radius: 8px;
  margin-bottom: 14px;
}
.footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  flex-wrap: wrap;
  padding-block: 30px;
}
.footer > div:nth-child(2) {
  display: flex;
  gap: 17px;
  flex-wrap: wrap;
  font-size: 0.85rem;
}
footer {
  border-top: 1px solid var(--line);
}
.login,
.preview {
  max-width: 820px;
}
.login form,
.engine {
  margin-top: 22px;
}
.notice {
  background: var(--sage);
  padding: 10px 14px;
  border-radius: 8px;
  margin-block: 12px;
}
.stack {
  display: grid;
  gap: 13px;
}
.formgrid,
.admin-layout {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 13px;
}
.admin-layout {
  grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr);
  align-items: start;
}
.admin-layout h2,
.admin .card h2 {
  font-size: 1.5rem;
  margin-bottom: 8px;
}
.stats strong {
  display: block;
  font-size: 1.6rem;
}
.stats .card {
  padding: 13px 19px;
}
.admin-item {
  padding-block: 10px;
  border-bottom: 1px solid var(--line);
  display: grid;
  gap: 8px;
}
.inline,
.checks {
  flex-wrap: wrap;
}
.inline input:not([type="checkbox"]) {
  width: auto;
  max-width: 100%;
}
label {
  display: grid;
  gap: 4px;
  font-size: 0.88rem;
  font-weight: 600;
}
input:not([type="checkbox"]),
select,
textarea {
  width: 100%;
  border: 1px solid #d9d1c7;
  border-radius: 7px;
  padding: 7px 9px;
  background: #fff;
  color: var(--ink);
  min-width: 0;
}
textarea {
  resize: vertical;
}
input[type="checkbox"] {
  accent-color: var(--ink);
}
fieldset {
  border: 1px solid var(--line);
  border-radius: 8px;
  min-width: 0;
}
legend {
  font-weight: 700;
}
fieldset p {
  margin-bottom: 6px;
}
.checks,
.checks label,
.check {
  display: flex;
  align-items: center;
  gap: 8px;
}
.checks {
  gap: 7px 14px;
}
.code {
  font-family: monospace;
}
.preview .eyebrow {
  margin-top: 20px;
}
.engine {
  padding: 0;
  overflow: hidden;
}
.engine-cover {
  min-height: min(72svh, 620px);
  display: grid;
  align-content: center;
  justify-items: center;
  text-align: center;
  gap: 15px;
  background: var(--sage) center/cover;
  padding: 25px;
}
.engine-cover small {
  color: inherit;
  letter-spacing: 0.15em;
}
.engine-cover video {
  max-width: 100%;
  max-height: 28vh;
}
.engine-content {
  padding: clamp(17px, 5vw, 40px);
  outline: none;
}
.engine-content section + section {
  border-top: 1px solid var(--line);
  margin-top: 18px;
  padding-top: 18px;
}
.engine-content h3,
.engine-content h2 {
  margin-bottom: 8px;
}
.engine-status {
  padding-inline: 16px;
  font-size: 0.85rem;
}
.engine-status:empty {
  display: none;
}
.countdown,
.photos {
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
}
.countdown span {
  min-width: 54px;
  text-align: center;
  background: var(--sage);
  border-radius: 8px;
  padding: 6px;
}
.countdown strong,
.countdown small {
  display: block;
}
.photos img {
  width: min(100%, 200px);
  height: 150px;
  object-fit: cover;
  border-radius: 8px;
}
.motion-fade .engine-content {
  animation: fade 0.45s ease both;
}
.motion-rise .engine-content {
  animation: rise 0.55s ease both;
}
@keyframes fade {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
@media (max-width: 850px) {
  .shell {
    width: calc(100% - 36px);
  }
  .hero {
    gap: 25px;
  }
  .hero-art {
    min-height: 350px;
  }
  .admin-layout {
    grid-template-columns: 1fr;
  }
}
@media (max-width: 660px) {
  .nav {
    flex-wrap: wrap;
    padding-block: 12px;
    min-height: 0;
  }
  .nav nav {
    width: 100%;
    order: 3;
    gap: 20px;
  }
  .hero {
    grid-template-columns: 1fr;
    padding-block: 36px;
  }
  .hero-art {
    min-height: 0;
    aspect-ratio: 4/3;
  }
  .how,
  .page {
    padding-block: 37px;
  }
  .grid:not(.stats),
  .formgrid {
    grid-template-columns: 1fr;
  }
  .stats {
    gap: 6px;
  }
  .stats .card {
    padding: 9px;
  }
  .strip-inner {
    justify-content: start;
  }
  .card {
    padding: 16px;
  }
}
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    scroll-behavior: auto !important;
  }
}
